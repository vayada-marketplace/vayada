name: Deploy Next TypeScript API

on:
  workflow_dispatch:
    inputs:
      publish_private_creation_only:
        description: "Publish an immutable private creation image without deploying the public API"
        type: boolean
        default: false
      private_creation_source_sha:
        description: "Optional reviewed 40-character source commit for the private primary or rollback image"
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "scripts/start-next-api.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-next-api.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-next-api-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: vayada-next-api
  AWS_ACCOUNT_ID: 269416271598
  APP_DIR: apps/api

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.COORDINATED_RELEASES_ENABLED != 'true' }}
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Validate private image source
        id: source
        env:
          PRIVATE_ONLY: ${{ inputs.publish_private_creation_only }}
          SOURCE_SHA: ${{ inputs.private_creation_source_sha }}
        run: |
          if [[ -n "$SOURCE_SHA" ]]; then
            [[ "$PRIVATE_ONLY" == "true" && "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          fi
          echo "sha=${SOURCE_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ env.APP_DIR }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            API_RUNTIME=next
            APPLICATION_RELEASE=${{ steps.source.outputs.sha }}
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ inputs.publish_private_creation_only && 'hotel-setup-creation' || 'next' }}-${{ steps.source.outputs.sha }}
            ${{ !inputs.publish_private_creation_only && format('{0}.dkr.ecr.{1}.amazonaws.com/{2}:next-latest', env.AWS_ACCOUNT_ID, env.AWS_REGION, env.ECR_REPOSITORY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable private image
        if: ${{ inputs.publish_private_creation_only }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Private creation source: `%s`\n\nImage digest: `%s`\n' "$SOURCE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch deploy to platform
        if: ${{ !inputs.publish_private_creation_only }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          repository: vayada-marketplace/vayada-platform
          event-type: app-image-published
          client-payload: |
            {
              "service": "next-target-backend",
              "ecr_repo": "${{ env.ECR_REPOSITORY }}",
              "image_sha": "next-${{ github.sha }}",
              "environment": "next"
            }
