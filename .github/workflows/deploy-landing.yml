name: Deploy Landing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/landing/**"
      - "packages/marketplace-shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-landing.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: 269416271598
  ECR_REPOSITORY: vayada-landing
  CONTACT_API_URL: https://api.vayada.com
  # VAY-2260: the Marketplace discovery check is gone; the TypeScript API base stays for
  # the shared public API client until the landing site no longer imports it.
  NEXT_API_URL: https://next-api.vayada.com
  # Public Web Analytics site identifier; automatic edge injection must stay off.
  CLOUDFLARE_ANALYTICS_TOKEN: 15ff9d551bd749d5930214d99f0eae70

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull the BuildKit image with retries
        run: |
          # Our public GHCR copy of moby/buildkit (vayada-platform "Mirror CI images", VAY-2258/VAY-2265):
          # anonymous ECR Public and Docker Hub pulls fail with "toomanyrequests" on shared runners.
          # Pinned to the upstream digest like build-coordinated-release.yml; bump it by hand after a
          # mirror refresh. Retried because a registry can still throttle; setup-buildx pulls it once more.
          for attempt in 1 2 3 4 5 6; do
            docker pull --quiet ghcr.io/vayada-marketplace/ci-buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea >/dev/null && exit 0
            echo "BuildKit pull failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The GHCR copy pulled above; Docker Hub and ECR Public rate-limit the BuildKit image.
          driver-opts: image=ghcr.io/vayada-marketplace/ci-buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/landing/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.CONTACT_API_URL }}
            NEXT_PUBLIC_VAYADA_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN=${{ env.CLOUDFLARE_ANALYTICS_TOKEN }}
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
