name: Deploy Next Marketplace Web

on:
  workflow_dispatch:
    inputs:
      publish_private_setup_only:
        description: Publish an immutable setup frontend image without deploying it
        type: boolean
        default: false
      private_setup_source_sha:
        description: Optional reviewed 40-character source commit for the private image
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "apps/marketplace-web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-next-marketplace-web.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-next-marketplace-web-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: vayada-next-marketplace-frontend
  AWS_ACCOUNT_ID: 269416271598
  APP_DIR: apps/marketplace-web
  NEXT_API_URL: https://next-api.vayada.com

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.COORDINATED_RELEASES_ENABLED != 'true' }}
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Validate private image source
        id: source
        env:
          PRIVATE_ONLY: ${{ inputs.publish_private_setup_only }}
          SOURCE_SHA: ${{ inputs.private_setup_source_sha }}
        run: |
          set -euo pipefail
          case "$PRIVATE_ONLY" in
            true)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "$GITHUB_REF" = refs/heads/main
              test "$GITHUB_REPOSITORY" = vayada-marketplace/vayada
              [[ "${SOURCE_SHA:-$GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]] || exit 1
              ;;
            false|"") test -z "$SOURCE_SHA" ;;
            *) exit 1 ;;
          esac
          echo "sha=${SOURCE_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_AUTH_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_VAYADA_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_AUTHKIT_LOGIN_ENABLED=true
            NEXT_PUBLIC_PLATFORM_MEDIA_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
            NEXT_PUBLIC_PMS_URL=https://next-pms.vayada.com
            NEXT_PUBLIC_BOOKING_ADMIN_URL=https://next-booking-admin.vayada.com
            NEXT_PUBLIC_MARKETPLACE_URL=https://next-marketplace.vayada.com
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ inputs.publish_private_setup_only && 'hotel-setup-frontend' || 'next' }}-${{ steps.source.outputs.sha }}
            ${{ !inputs.publish_private_setup_only && format('{0}.dkr.ecr.{1}.amazonaws.com/{2}:next-latest', env.AWS_ACCOUNT_ID, env.AWS_REGION, env.ECR_REPOSITORY) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable private image
        if: ${{ inputs.publish_private_setup_only }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'Private source `%s`\n\nImage digest `%s`\n' "$SOURCE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch deploy to platform
        if: ${{ !inputs.publish_private_setup_only }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          repository: vayada-marketplace/vayada-platform
          event-type: app-image-published
          client-payload: |
            {
              "service": "next-marketplace-frontend",
              "ecr_repo": "${{ env.ECR_REPOSITORY }}",
              "image_sha": "next-${{ github.sha }}",
              "environment": "next"
            }
