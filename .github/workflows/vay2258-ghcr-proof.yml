name: VAY-2258 GHCR proof (temporary)

# Temporary proof for VAY-2258; removed before the PR is marked ready. Runs only on pushes to the
# PR branch, with no secrets, no AWS, no registry login and no GitHub Actions cache writes.
# 1. Every pinned GHCR image pulls without logging in and has the upstream digest.
# 2. BuildKit comes from the exact reference in build-coordinated-release.yml, set up the same way.
# 3. api and pms-web built first from this branch's Dockerfile (GHCR, fresh builder, full build) and
#    then from main's Dockerfile (ECR Public / Docker Hub) on the same builder give the same image
#    digest: BuildKit reuses every step only when the base digests match, so the images are identical.

on:
  push:
    branches:
      - fm/vay-2258-buildkit-ghcr

permissions:
  contents: read

jobs:
  anonymous-pulls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pull every pinned GHCR image without logging in
        run: |
          set -euo pipefail
          docker logout ghcr.io > /dev/null 2>&1 || true
          refs="$(grep -h -o -E 'ghcr\.io/vayada-marketplace/ci-(buildkit|dockerfile|node):[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' \
            .github/workflows/build-coordinated-release.yml apps/*/Dockerfile | sort -u)"
          test -n "$refs"
          echo "| Pinned reference | Pulled anonymously | Index digest (sha256 of raw manifest) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          while read -r ref; do
            repository="${ref#ghcr.io/}"; repository="${repository%%:*}"
            pinned="${ref##*@}"
            token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repository}:pull" | jq -r .token)"
            raw_digest="sha256:$(curl -fsS -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repository}/manifests/${pinned}" | sha256sum | cut -d ' ' -f 1)"
            test "$raw_digest" = "$pinned"
            docker pull "$ref"
            echo "| \`${ref}\` | yes | \`${raw_digest}\` |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$refs"

  same-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, pms-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the BuildKit reference from the release workflow
        id: buildkit
        run: |
          set -euo pipefail
          image="$(sed -n -E 's/^ *driver-opts: image=(.*)$/\1/p' .github/workflows/build-coordinated-release.yml)"
          grep -q -F "docker pull --quiet ${image} " .github/workflows/build-coordinated-release.yml
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Pull the BuildKit image with retries
        env:
          BUILDKIT_IMAGE: ${{ steps.buildkit.outputs.image }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            docker pull --quiet "${BUILDKIT_IMAGE}" >/dev/null && exit 0
            echo "BuildKit pull failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ steps.buildkit.outputs.image }}

      - name: Build from main's and this branch's Dockerfile and compare
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          git show "origin/main:apps/${APP}/Dockerfile" > "${RUNNER_TEMP}/Dockerfile.main"
          cp "apps/${APP}/Dockerfile" "${RUNNER_TEMP}/Dockerfile.branch"
          diff "${RUNNER_TEMP}/Dockerfile.main" "${RUNNER_TEMP}/Dockerfile.branch" || true
          case "$APP" in
            api) build_args=(--build-arg API_RUNTIME=next --build-arg APPLICATION_RELEASE=vay2258-proof) ;;
            pms-web)
              build_args=()
              for name in NEXT_PUBLIC_AUTH_API_URL NEXT_PUBLIC_PMS_API_URL NEXT_PUBLIC_PMS_OPERATIONS_API_URL \
                NEXT_PUBLIC_PLATFORM_MEDIA_API_URL; do
                build_args+=(--build-arg "${name}=https://next-api.vayada.com")
              done
              build_args+=(
                --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=vay2258-proof-not-a-key
                --build-arg NEXT_PUBLIC_BOOKING_ADMIN_URL=https://next-booking-admin.vayada.com
                --build-arg NEXT_PUBLIC_MARKETPLACE_URL=https://next-marketplace.vayada.com
                --build-arg NEXT_PUBLIC_AUTHKIT_LOGIN_ENABLED=true
                --build-arg NEXT_PUBLIC_AIRBNB_IMPORT_ENABLED=true
                --build-arg NEXT_PUBLIC_AUTHKIT_COMPATIBILITY_TOKEN_ENABLED=false
              )
              ;;
          esac
          for variant in branch main; do
            for attempt in 1 2 3; do
              if docker buildx build \
                --platform linux/amd64 \
                --provenance=false --sbom=false \
                --progress plain \
                --file "${RUNNER_TEMP}/Dockerfile.${variant}" \
                --output "type=oci,dest=${RUNNER_TEMP}/${variant}.tar" \
                --metadata-file "${RUNNER_TEMP}/${variant}.json" \
                "${build_args[@]}" \
                . > "${RUNNER_TEMP}/${variant}.log" 2>&1; then
                break
              fi
              tail -n 40 "${RUNNER_TEMP}/${variant}.log"
              if [ "$attempt" -eq 3 ] || ! grep -q -E 'toomanyrequests|Rate exceeded' "${RUNNER_TEMP}/${variant}.log"; then
                exit 1
              fi
              sleep $((attempt * 30))
            done
            echo "::group::${variant}: pulls and cache"
            grep -E 'load metadata for|resolve image config|docker-image://|\] FROM |CACHED' "${RUNNER_TEMP}/${variant}.log" || true
            echo "::endgroup::"
          done
          main_digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/main.json")"
          branch_digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/branch.json")"
          main_config="$(jq -r '."containerimage.config.digest"' "${RUNNER_TEMP}/main.json")"
          branch_config="$(jq -r '."containerimage.config.digest"' "${RUNNER_TEMP}/branch.json")"
          branch_pulls="$(grep -E 'load metadata for|resolve image config' "${RUNNER_TEMP}/branch.log" | sed -E 's/^#[0-9]+ //' | sort -u)"
          {
            echo "### ${APP}"
            echo "| Dockerfile | Image manifest digest | Config digest |"
            echo "|---|---|---|"
            echo "| branch (GHCR, pinned; built first) | \`${branch_digest}\` | \`${branch_config}\` |"
            echo "| main (ECR Public / Docker Hub; built second) | \`${main_digest}\` | \`${main_config}\` |"
            echo
            echo "Branch build resolved:"
            echo '```'
            echo "${branch_pulls}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "main=${main_digest} branch=${branch_digest}"
          if grep -E 'load metadata for|resolve image config|docker-image://' "${RUNNER_TEMP}/branch.log" | grep -v -q 'ghcr.io/vayada-marketplace/'; then
            echo "::error::The branch build resolved an image outside ghcr.io/vayada-marketplace"
            exit 1
          fi
          test "$main_digest" = "$branch_digest"
          test "$main_config" = "$branch_config"
