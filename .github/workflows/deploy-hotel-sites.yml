name: Deploy Hotel Sites

# VAY-2422: the hotel websites are static files on Cloudflare Pages, one project per hotel
# (vayada-site-<slug>). A push to main that touches them rebuilds every hotel's site and publishes
# it (apps/hotel-sites/scripts/deploy-pages.mjs). Outside the release train: no API, no data.
# A site stays out of search while its content says `indexable: false` (meta robots and an
# X-Robots-Tag on every file), and the pages.dev addresses always do.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/hotel-sites/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-hotel-sites.yml"

permissions:
  contents: read

concurrency:
  group: deploy-hotel-sites
  cancel-in-progress: false

env:
  # vayada's Cloudflare account: an identifier, not a secret (the token is).
  CLOUDFLARE_ACCOUNT_ID: 28387a80210be61a4af9b4e37036d8d3

jobs:
  token:
    name: Pages token present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check for the Pages token
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CLOUDFLARE_PAGES_API_TOKEN secret yet: nothing was published."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and publish to Cloudflare Pages
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build every hotel's site
        run: npm run build:hotel-sites

      - name: Publish to Cloudflare Pages
        run: node apps/hotel-sites/scripts/deploy-pages.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
