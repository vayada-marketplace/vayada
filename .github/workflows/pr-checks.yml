      - name: Checkout reviewed compatible setup rollback source
        if: matrix.shard == 'hotel-setup'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 480602efd31b71e7997be1c5aae2c23930be3933
          path: .hotel-setup-compatible-rollback
          persist-credentials: false

      - name: Build separately compiled compatible setup rollback
        if: matrix.shard == 'hotel-setup'
        working-directory: .hotel-setup-compatible-rollback
        run: |
          test "$(git rev-parse HEAD)" = 480602efd31b71e7997be1c5aae2c23930be3933
          # This checkout relies on its own prebuild hooks to compile its backend packages.
          unset npm_config_ignore_scripts
          npm ci
          npm run build:api

      - name: Verify native reader staging, login and secret candidates
        if: matrix.shard == 'hotel-setup'
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import { spawnSync } from "node:child_process";
          import pg from "pg";
          const admin = new pg.Client({connectionString: process.env.ADMIN_URL});
          await admin.connect();
          const role = "vay1092_reader_proof_admin";
          const password = randomBytes(36).toString("base64url");
          await admin.query(`CREATE ROLE ${role} LOGIN SUPERUSER PASSWORD ${admin.escapeLiteral(password)}`);
          try {
            const url = new URL(process.env.ADMIN_URL);
            url.hostname = "127.0.0.1";
            url.pathname = "/vay1092_vay965_creation_test";
            url.username = role;
            url.password = password;
            url.search = "?sslmode=verify-full";
            const env = {...process.env};
            for (const name of ["STAGE", "LOGIN", "CANDIDATE", "PREFLIGHT"])
              env[`HOTEL_SETUP_READER_${name}_TEST_DATABASE_URL`] = url.toString();
            env.HOTEL_SETUP_PROPERTY_STAGE_TEST_DATABASE_URL = url.toString();
            env.HOTEL_SETUP_AUTOMATIC_DISCOVERY_TEST_DATABASE_URL = url.toString();
            const result = spawnSync("npm", ["--workspace", "vayada-api", "run", "test", "--", "--no-file-parallelism",
              "src/hotelSetupReaderRoleStaging.integration.test.ts", "src/hotelSetupReaderLoginVerification.integration.test.ts",
              "src/hotelSetupReaderSecretCandidate.integration.test.ts", "src/cli/hotelSetupPropertyPreflight.test.ts",
              "src/cli/hotelSetupReaderPreflight.test.ts", "src/hotelSetupPropertyRoleStaging.integration.test.ts",
              "src/hotelSetupAutomaticDiscovery.integration.test.ts",
              "src/hotelSetupProfileLifecycle.integration.test.ts"], {env, stdio: "inherit"});
            process.exitCode = result.status ?? 1;
            if (result.status === 0) {
              await admin.query("CREATE DATABASE vay1092_readiness_organization_test TEMPLATE vay1092_vay965_creation_test");
              url.pathname = "/vay1092_readiness_organization_test";
              env.HOTEL_SETUP_ORGANIZATION_BOOTSTRAP_TEST_DATABASE_URL = url.toString();
              const organization = spawnSync("npm", ["--workspace", "vayada-api", "run", "test", "--", "--no-file-parallelism",
                "src/hotelSetupOrganizationProvisioning.integration.test.ts"], {env, stdio: "inherit"});
              process.exitCode = organization.status ?? 1;
            }
            if (process.exitCode === 0) {
              const connections = await admin.query("SELECT count(*)::int AS count FROM pg_stat_activity WHERE datname='vay1092_vay965_creation_test'");
              if (connections.rows[0]?.count !== 0) throw new Error("Native template connections must close before cloning");
              await admin.query("CREATE DATABASE vay1092_automatic_owner_flow_test TEMPLATE vay1092_vay965_creation_test");
              const flowUrl = new URL(url);
              flowUrl.pathname = "/vay1092_automatic_owner_flow_test";
              const flowEnv = {...env,
                HOTEL_SETUP_AUTOMATIC_OWNER_FLOW_TEST_DATABASE_URL: flowUrl.toString(),
                HOTEL_SETUP_AUTOMATIC_ROLLBACK_PREFLIGHT_ROOT: `${process.env.GITHUB_WORKSPACE}/.hotel-setup-compatible-rollback`};
              const flow = spawnSync("npm", ["--workspace", "vayada-api", "run", "test", "--", "--no-file-parallelism",
                "src/hotelSetupAutomaticOwnerFlow.integration.test.ts",
                "src/hotelSetupAutomaticCreatorFlow.integration.test.ts",
                "src/hotelSetupAutomaticReaderRls.integration.test.ts"], {env: flowEnv, stdio: "inherit"});
              process.exitCode = flow.status ?? 1;
            }
            if (process.exitCode === 0) {
              const connections = await admin.query("SELECT count(*)::int AS count FROM pg_stat_activity WHERE datname='vay1092_vay965_creation_test'");
              if (connections.rows[0]?.count !== 0) throw new Error("Native template connections must close before cloning");
              await admin.query("CREATE DATABASE vay1092_approved_backfill_test TEMPLATE vay1092_vay965_creation_test");
              const backfillUrl = new URL(url);
              backfillUrl.pathname = "/vay1092_approved_backfill_test";
              const backfillEnv = {...env,
                HOTEL_SETUP_APPROVED_BACKFILL_TEST_DATABASE_URL: backfillUrl.toString(),
                HOTEL_SETUP_APPROVED_BACKFILL_ROLLBACK_ROOT: `${process.env.GITHUB_WORKSPACE}/.hotel-setup-compatible-rollback`};
              const backfill = spawnSync("npm", ["--workspace", "vayada-api", "run", "test", "--", "--no-file-parallelism",
                "src/hotelSetupApprovedReadinessBackfill.integration.test.ts",
                "src/hotelSetupReadinessReaderGrant.integration.test.ts"], {env: backfillEnv, stdio: "inherit"});
              process.exitCode = backfill.status ?? 1;
            }
          } finally {
            await admin.query(`DROP ROLE ${role}`);
            await admin.end();
          }
          NODE
        env:
          ADMIN_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify private setup authentication and credential handling
