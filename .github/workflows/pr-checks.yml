      # Last: it creates the cluster-wide RDS-like vayada_admin creator.
      - name: Verify protected logo lifecycle with an RDS-like creator
        if: matrix.shard == 'hotel-setup'
        env:
          ADMIN_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test
          MIGRATION_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay1092_vay965_logo_test
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay1092_vay965_logo_test?sslmode=verify-full
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          node --input-type=module -e 'import pg from "pg"; const client=new pg.Client({connectionString:process.env.ADMIN_URL}); await client.connect(); await client.query("CREATE DATABASE vay1092_vay965_logo_test"); await client.end();'
          TARGET_DATABASE_URL="$MIGRATION_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          CREATOR_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$CREATOR_PASSWORD"
          export CREATOR_PASSWORD
          # Mirror the RDS administrator: CREATEROLE without superuser or password-catalog access.
          node --input-type=module <<'NODE'
          import pg from "pg";
          const admin = new pg.Client({connectionString: process.env.MIGRATION_URL});
          await admin.connect();
          await admin.query(`CREATE ROLE vayada_admin LOGIN NOINHERIT NOSUPERUSER CREATEROLE CREATEDB
            NOREPLICATION NOBYPASSRLS PASSWORD ${admin.escapeLiteral(process.env.CREATOR_PASSWORD)}`);
          await admin.query(`GRANT ALL ON DATABASE vay1092_vay965_logo_test TO vayada_admin WITH GRANT OPTION;
            GRANT vayada_next_hotel_setup_logo_scope TO vayada_admin WITH ADMIN TRUE, INHERIT FALSE, SET FALSE;
            GRANT vayada_next_hotel_setup_profile_scope TO vayada_admin WITH ADMIN TRUE, INHERIT FALSE, SET FALSE`);
          for (const schema of ["identity", "hotel_catalog", "platform"])
            await admin.query(`GRANT ALL ON SCHEMA ${schema} TO vayada_admin WITH GRANT OPTION;
              GRANT ALL ON ALL TABLES IN SCHEMA ${schema} TO vayada_admin WITH GRANT OPTION;
              GRANT ALL ON ALL SEQUENCES IN SCHEMA ${schema} TO vayada_admin WITH GRANT OPTION`);
          await admin.query(`REVOKE EXECUTE ON FUNCTION platform.tenant_scope_key(text,uuid,uuid),
            platform.valid_tenant_scope(text,uuid,uuid) FROM PUBLIC`);
          const {rows} = await admin.query(`SELECT pg_catalog.has_table_privilege('vayada_admin','pg_catalog.pg_authid','SELECT')
            OR pg_catalog.has_table_privilege('vayada_admin','pg_catalog.pg_authid','UPDATE') AS catalog`);
          if (rows[0].catalog) throw new Error("RDS-like creator must not access the password catalog");
          await admin.end();
          NODE
          VAY965_LOGO_CREATOR_DATABASE_URL="postgresql://vayada_admin:${CREATOR_PASSWORD}@127.0.0.1:5432/vay1092_vay965_logo_test?sslmode=verify-full" \
            HOTEL_SETUP_PROPERTY_STAGE_TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            npm --workspace vayada-api run test -- --no-file-parallelism \
            src/hotelSetupLogoLifecycle.integration.test.ts src/hotelSetupProfileLifecycle.integration.test.ts \
            src/hotelSetupLogoMedia.integration.test.ts \
