      - name: Configure trusted TLS for native creation preflight
        if: matrix.shard == 'hotel-setup'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          tls_dir="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.crt" >/dev/null 2>&1
          docker exec --user 0 "$PG_CONTAINER" mkdir -p /tmp/creation-tls
          docker cp "$tls_dir/server.key" "$PG_CONTAINER:/tmp/creation-tls/server.key"
          docker cp "$tls_dir/server.crt" "$PG_CONTAINER:/tmp/creation-tls/server.crt"
          docker exec --user 0 "$PG_CONTAINER" chown -R postgres:postgres /tmp/creation-tls
          docker exec --user 0 "$PG_CONTAINER" chmod 600 /tmp/creation-tls/server.key
          for setting in "ssl_cert_file = '/tmp/creation-tls/server.crt'" "ssl_key_file = '/tmp/creation-tls/server.key'" "ssl = on"; do
            docker exec "$PG_CONTAINER" psql -U vayada_test -d vayada_api_test -c "ALTER SYSTEM SET $setting"
          done
          docker exec "$PG_CONTAINER" psql -U vayada_test -d vayada_api_test -c 'SELECT pg_reload_conf()'
          tls_ready=false
          for attempt in $(seq 1 20); do
            if docker exec --env PGPASSWORD=vayada_test --env PGSSLMODE=verify-full \
              --env PGSSLROOTCERT=/tmp/creation-tls/server.crt "$PG_CONTAINER" \
              psql -h 127.0.0.1 -U vayada_test -d vayada_api_test -c 'SELECT 1' >/dev/null 2>&1; then
              tls_ready=true; break
            fi
            sleep 1
          done
          test "$tls_ready" = true
          # Retain only the public certificate for client trust.
          rm "$tls_dir/server.key"
          echo "NODE_EXTRA_CA_CERTS=$tls_dir/server.crt" >> "$GITHUB_ENV"

      - name: Verify native property creation with exact grants
        if: matrix.shard == 'hotel-setup'
        run: |
          node --input-type=module -e 'import pg from "pg"; const client=new pg.Client({connectionString:process.env.ADMIN_URL}); await client.connect(); await client.query("CREATE DATABASE vay1092_vay965_creation_test"); await client.end();'
          TARGET_DATABASE_URL="$TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          npm --workspace vayada-api run test -- --no-file-parallelism src/hotelSetupCreationPrivileges.integration.test.ts src/hotelSetupCreationScope.integration.test.ts src/hotelSetupCreationContacts.integration.test.ts src/hotelSetupCreationIdentity.integration.test.ts src/hotelSetupCreationProducts.integration.test.ts src/hotelSetupPropertyFinancialsScope.integration.test.ts src/hotelSetupLaunchSettingsScope.integration.test.ts src/hotelSetupProfileEdit.integration.test.ts
