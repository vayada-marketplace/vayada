          src/channexBookingRevisionTombstonesMigration.integration.test.ts
          src/channexAdoptionManifestFoundation.integration.test.ts
          src/channexAdoptionConsumer.integration.test.ts
          src/channexAdoptionEvidence.integration.test.ts
          src/stripeWebhookReceiptRetention.integration.test.ts
          src/bookingWebEventsMigration.integration.test.ts
          src/bookingWebEventsLogBlanking.integration.test.ts
          src/productionMediaMigration.integration.test.ts
          src/productionCatalogWriters.integration.test.ts
          src/productionBookingWriters.integration.test.ts
          src/productionPmsWriters.integration.test.ts
          src/productionCutover.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify Finance OTA commission migration
        if: matrix.shard == 'pms'
        run: >-
          npm --workspace @vayada/backend-migration run test --
          src/financeOtaCommissionRules.test.ts src/providerFeeEvidenceMigration.integration.test.ts
          src/airbnbProviderSnapshots.test.ts && npm --workspace vayada-api run test --
          src/domains/financeOtaCommissionEvidence.integration.test.ts
          src/domains/financeAirbnbProviderSnapshot.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify membership property scope migration
        if: matrix.shard == 'pms'
        run: >-
          npm --workspace @vayada/backend-migration run test --
          --no-file-parallelism src/membershipPropertyScope.test.ts
          src/membershipDelegations.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Run public gallery migration integration
        if: matrix.shard == 'pms'
        run: >-
          npm --workspace @vayada/backend-migration run test --
          src/publicBookabilityGalleryMedia.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Run pending booking edits in an isolated database
        if: matrix.shard == 'pms'
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_booking_edit_test
          TARGET_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_booking_edit_test
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.TEST_DATABASE_URL);
            url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href });
            await client.connect();
            await client.query("CREATE DATABASE vayada_booking_edit_test");
            await client.end();
          '
          npm --workspace @vayada/backend-migration run target:migrate -- --env local
          npm --workspace vayada-api run test -- --no-file-parallelism src/routes/pendingBookingEdits.integration.test.ts

      - name: Verify removed pricing boundaries
        if: matrix.shard == 'pms'
        run: >-
          npm --workspace vayada-api run test -- --no-file-parallelism
          src/pricingReset.test.ts src/integrations/channexManagementPlans.test.ts

  setup_draft_reset_postgres:
    name: Setup Draft Reset PostgreSQL ${{ matrix.postgres }} Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.run_setup_draft_reset_postgres == 'true'
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]

    services:
      postgres:
        image: ghcr.io/vayada-marketplace/ci-postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: vayada_test
          POSTGRES_PASSWORD: vayada_test
          POSTGRES_DB: vayada_api_test
        options: >-
          --health-cmd "pg_isready -U vayada_test -d vayada_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply target migrations
        run: npm --workspace @vayada/backend-migration run target:migrate -- --env local
        env:
          TARGET_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Run setup draft reset integration
        run: >-
          npm --workspace vayada-api run test --
          --no-file-parallelism
          src/propertySetupDraftCommand.test.ts
          src/propertySetupCalendarDraftManifest.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

  backend:
    name: Backend Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.run_backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: marketplace-api
            app_dir: apps/marketplace-api
            db_user: vayada_user
            db_password: vayada_password
            db_name: vayada_db
            test_db_name: vayada_test_db
            db_port: 5432
            cors_origins: http://localhost:3000,http://localhost:3001
            frontend_url: http://localhost:3000
          - app: booking-api
            app_dir: apps/booking-api
            db_user: vayada_booking_user
            db_password: vayada_booking_password
            db_name: vayada_booking_db
            db_port: 5434
            cors_origins: http://localhost:3000,http://localhost:3002,http://localhost:3003,https://booking.tigalombok.com
          - app: pms-api
            app_dir: apps/pms-api
            db_user: vayada_pms_user
            db_password: vayada_pms_password
            db_name: vayada_pms_db
            db_port: 5436
            cors_origins: http://localhost:3002,http://localhost:3003

    defaults:
      run:
        working-directory: ${{ matrix.app_dir }}

    services:
      postgres:
        image: ghcr.io/vayada-marketplace/ci-postgres:15-alpine
        env:
          POSTGRES_USER: ${{ matrix.db_user }}
          POSTGRES_PASSWORD: ${{ matrix.db_password }}
          POSTGRES_DB: ${{ matrix.db_name }}
        options: >-
          --health-cmd "pg_isready -U ${{ matrix.db_user }} -d ${{ matrix.db_name }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - ${{ matrix.db_port }}:5432

      auth-postgres:
        image: ghcr.io/vayada-marketplace/ci-postgres:15-alpine
        env:
          POSTGRES_USER: vayada_auth_user
          POSTGRES_PASSWORD: vayada_auth_password
          POSTGRES_DB: vayada_auth_db
        options: >-
          --health-cmd "pg_isready -U vayada_auth_user -d vayada_auth_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5435:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        timeout-minutes: 5
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y postgresql-client

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.app_dir }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up auth database schema
        working-directory: ${{ github.workspace }}
        run: |
          for i in {1..30}; do
            if PGPASSWORD=vayada_auth_password psql -h localhost -p 5435 -U vayada_auth_user -d vayada_auth_db -c '\q' 2>/dev/null; then
              break
            fi
            sleep 2
          done

          for f in auth-db/migrations/*.sql; do
            PGPASSWORD=vayada_auth_password psql -h localhost -p 5435 -U vayada_auth_user -d vayada_auth_db -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run app database migrations
        run: |
          for i in {1..30}; do
            if PGPASSWORD="${{ matrix.db_password }}" psql -h localhost -p "${{ matrix.db_port }}" -U "${{ matrix.db_user }}" -d "${{ matrix.db_name }}" -c '\q' 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ "${{ matrix.app }}" = "marketplace-api" ]; then
            PGPASSWORD="${{ matrix.db_password }}" psql -h localhost -p "${{ matrix.db_port }}" -U "${{ matrix.db_user }}" -d "${{ matrix.db_name }}" -c "CREATE DATABASE ${{ matrix.test_db_name }};" || true
            PYTHONPATH=. python scripts/run_migrations.py
          else
            for f in migrations/*.sql; do
              PGPASSWORD="${{ matrix.db_password }}" psql -h localhost -p "${{ matrix.db_port }}" -U "${{ matrix.db_user }}" -d "${{ matrix.db_name }}" -f "$f"
            done
          fi
        env:
          DATABASE_URL: postgresql://${{ matrix.db_user }}:${{ matrix.db_password }}@localhost:${{ matrix.db_port }}/${{ matrix.test_db_name || matrix.db_name }}
          AUTH_DATABASE_URL: postgresql://vayada_auth_user:vayada_auth_password@localhost:5435/vayada_auth_db
          PYTHONPATH: .
          CORS_ORIGINS: ${{ matrix.cors_origins }}
          EMAIL_ENABLED: "true"
          DEBUG: "true"
          JWT_SECRET_KEY: test-secret-key-for-testing-only
          FRONTEND_URL: ${{ matrix.frontend_url || 'http://localhost:3000' }}

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://${{ matrix.db_user }}:${{ matrix.db_password }}@localhost:${{ matrix.db_port }}/${{ matrix.test_db_name || matrix.db_name }}
          AUTH_DATABASE_URL: postgresql://vayada_auth_user:vayada_auth_password@localhost:5435/vayada_auth_db
          TEST_DATABASE_URL: postgresql://${{ matrix.db_user }}:${{ matrix.db_password }}@localhost:${{ matrix.db_port }}/${{ matrix.test_db_name || matrix.db_name }}
          MARKETPLACE_DATABASE_URL: ""
          PMS_API_URL: http://localhost:8002
          CORS_ORIGINS: ${{ matrix.cors_origins }}
          EMAIL_ENABLED: "true"
          DEBUG: "true"
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-for-testing-only
          FRONTEND_URL: ${{ matrix.frontend_url || 'http://localhost:3000' }}
          SMTP_HOST: ""
          S3_BUCKET_NAME: test-bucket
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test-access-key
          AWS_SECRET_ACCESS_KEY: test-secret-key

  required:
    name: Required Checks
    runs-on: ubuntu-latest
    # A merge queue entry may also wait here while a hold is open (up to 120 minutes), which must
    # stay below the ruleset's status check timeout (180 minutes).
    timeout-minutes: ${{ github.event_name == 'merge_group' && 130 || 5 }}
    permissions:
      contents: read
      issues: read
    needs:
      - changes
      - frontend
      - frontend_build
      - first_party_auth
      - pms_web_e2e
      - marketplace_web_e2e
      - booking_web_e2e
      - api_unit
      - api_postgres
      - setup_draft_reset_postgres
      - backend
    # always(): run (and fail) even when a needed job failed, was cancelled or timed out. A skipped
    # required job would satisfy the branch ruleset, so this job must never be skipped itself.
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/pr-checks.mjs verify

      # A passing queue entry merges as soon as this job succeeds, so an open release-train-hold
      # issue keeps it waiting here. Failed entries stop at the step above and leave the queue.
      - name: Wait while a merge queue hold is open
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/pr-checks.mjs hold
