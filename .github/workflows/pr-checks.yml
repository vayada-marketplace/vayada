        if: matrix.shard == 'hotel-setup'
        run: |
          npm --workspace vayada-api run test -- --no-file-parallelism src/sharedHotelSetupProfile.integration.test.ts -t 'provisions one canonical property for concurrent stable-reference commands'
        env:
