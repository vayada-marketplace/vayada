name: PR Checks

on:
  pull_request:
    # Every base branch a stack sits on, so a new stack never edits this list. GitHub matches
    # these against the PR's base branch; `**` also matches `/`.
    branches:
      - main
      - "fm/**"
      - "fix/**"
      - "flamurmaliqi2811/**"
  # The merge queue tests each queued PR on top of main and the entries ahead of it; the ruleset
  # waits for the same "Required Checks" status there.
  merge_group:
    types: [checks_requested]
    branches:
      - main
  # A full run of every job on any branch, e.g. as the release precheck on the main tip.
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Job selection is path-based and fails safe: scripts/ci/pr-checks.mjs maps each changed file to
# the jobs that cover it, and any file it cannot classify selects every job. "Required Checks"
# stays the single required status and only accepts a job that succeeded or that was skipped
# because the selector excluded it. Selection lives on the jobs, not on `on.pull_request.paths`,
# so the required status is always reported.
jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_frontend: ${{ steps.select.outputs.run_frontend }}
      run_frontend_build: ${{ steps.select.outputs.run_frontend_build }}
      run_first_party_auth: ${{ steps.select.outputs.run_first_party_auth }}
      run_pms_web_e2e: ${{ steps.select.outputs.run_pms_web_e2e }}
      run_marketplace_web_e2e: ${{ steps.select.outputs.run_marketplace_web_e2e }}
      run_booking_web_e2e: ${{ steps.select.outputs.run_booking_web_e2e }}
      run_api_unit: ${{ steps.select.outputs.run_api_unit }}
      run_api_postgres: ${{ steps.select.outputs.run_api_postgres }}
      run_setup_draft_reset_postgres: ${{ steps.select.outputs.run_setup_draft_reset_postgres }}
      run_backend: ${{ steps.select.outputs.run_backend }}

    steps:
      - name: Checkout merge commit and its parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # A queue entry sits on the entries ahead of it, so it needs enough history to reach main.
          fetch-depth: ${{ github.event_name == 'merge_group' && 50 || 2 }}
          persist-credentials: false

      - name: Fetch the merge queue's base branch
        if: github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        # Without the base the selector cannot find a merge-base and runs every job.
        run: |
          git fetch --no-tags --depth=50 origin "+${BASE_REF}:refs/remotes/origin/merge-queue-base" ||
            echo "::warning::Could not fetch ${BASE_REF}; every job will run"

      - name: Select jobs from changed paths
        id: select
        env:
          MERGE_GROUP_BASE: refs/remotes/origin/merge-queue-base
        run: node scripts/ci/pr-checks.mjs select

  frontend:
    name: Frontend Test, Typecheck, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.run_frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture boundaries
        run: npm run check:architecture-boundaries

      - name: Coordinated release contracts
        run: npm run test:coordinated-release

      - name: PR check selection and aggregation contracts
        run: npm run test:pr-checks

      - name: Finance domain contracts
        run: npm --workspace @vayada/domain-finance run test

      - name: Feature Hub package tests
        run: npm --workspace @vayada/feature-hub run test

      - name: Hotel domain and product onboarding tests
        run: |
          npm --workspace @vayada/domain-hotels run build
          npm --workspace @vayada/domain-hotels run test
          # product-onboarding's publication client imports @vayada/domain-booking at runtime.
          npm --workspace @vayada/domain-booking run build
          npm --workspace @vayada/product-onboarding run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Booking Admin tests
        run: npm --workspace vayada-booking-engine-frontend-admin run test

      - name: Settings UI package tests
        run: npm --workspace @vayada/settings-ui run test

      - name: Booking Web tests
        run: npm --workspace vayada-booking-engine-frontend run test

  # The second half of the old frontend job, so it builds while frontend typechecks and lints.
  # `npm run build` needs nothing from frontend's steps: apps/api comes first and its prebuild
  # builds every backend and domain package the apps import.
  frontend_build:
    name: Frontend Build and App Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.run_frontend_build == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: "00000000000000000000000000000000"

      # Runs after Build because PMS Web tests import the built @vayada/domain-* packages.
      - name: PMS Web tests
        run: npm --workspace vayada-pms-frontend run test

      - name: Vayada Admin tests
        run: npm --workspace vayada-admin run test

      - name: Marketplace Web tests
        run: npm --workspace vayada-creator-marketplace run test

      - name: Landing consent browser regressions
        run: |
          npx playwright install --with-deps chromium
          npm --workspace vayada-landing run start -- --port 3006 &
          landing_pid=$!
          trap 'kill "$landing_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3006/ >/dev/null; then break; fi
            sleep 1
          done
          npm run e2e:landing -- --workers=2
        env:
          CI: "false"
          E2E_START_SERVERS: "0"
          E2E_LANDING_BASE_URL: http://127.0.0.1:3006
          E2E_LANDING_ANALYTICS: "1"

  first_party_auth:
    name: First-Party Auth Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.run_first_party_auth == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend domain packages
        run: |
          npm --workspace @vayada/domain-hotels run build
          npm --workspace @vayada/domain-booking run build
          npm --workspace @vayada/domain-marketplace run build
          npm --workspace @vayada/domain-pms run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify frontend auth gateways
        run: |
          npm --workspace vayada-creator-marketplace run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-booking-engine-frontend-admin run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-pms-frontend run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-admin run test -- 'app/auth/[...path]/route.test.ts'

      - name: Run first-party auth browser regressions
        run: npm run e2e:first-party-auth
        env:
          E2E_FIRST_PARTY_AUTH_ONLY: "1"
          E2E_START_SERVERS: "1"

  # The mocked pms-web Playwright project against a plain-port dev server. Every API call is
  # mocked in tests/e2e/support, so no backend or database runs here.
  pms_web_e2e:
    name: PMS Web Browser Specs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.run_pms_web_e2e == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the packages pms-web imports
        run: npm --workspace vayada-api run build:backend-packages

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the pms-web browser specs
        run: |
          npm run dev:pms-web > "$RUNNER_TEMP/pms-web-dev.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            kill -0 "$dev_pid" 2>/dev/null || break
            if curl --silent --fail --max-time 5 http://localhost:3164/login >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail --max-time 10 http://localhost:3164/login >/dev/null || { tail -50 "$RUNNER_TEMP/pms-web-dev.log"; exit 1; }
          npm run e2e:pms-web -- --workers=1 --retries=1
        env:
          # Any non-empty CI makes playwright.config.ts use CI reporters; "false" keeps it from
          # starting every app's webServer (that needs CI === "true").
          CI: "false"
          PLAYWRIGHT_HTML_OPEN: never
          E2E_START_SERVERS: "0"
          PORT: "3164"
          AUTH_PUBLIC_ORIGIN: http://localhost:3164
          NEXT_PUBLIC_MARKETPLACE_URL: http://marketplace.localhost:3000
          NEXT_PUBLIC_BOOKING_ADMIN_URL: http://admin.booking.localhost:3003
          E2E_PMS_BASE_URL: http://localhost:3164
          E2E_MARKETPLACE_BASE_URL: http://marketplace.localhost:3000

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pms-web-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The mocked marketplace-web Playwright project against a plain-port dev server, then the
  # opt-in Airbnb import specs against a second dev server with the callback preview on. Every API
  # call is mocked in the specs and tests/e2e/support.
  marketplace_web_e2e:
    name: Marketplace Web Browser Specs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.run_marketplace_web_e2e == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the packages marketplace-web imports
        run: npm --workspace vayada-api run build:backend-packages

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the marketplace-web browser specs
        run: |
          # The dev server's env matches playwright.config.ts's marketplace-web webServer entry.
          # Usage: start_dev_server LOG_NAME [EXTRA_ENV=value ...]
          start_dev_server() {
            dev_log="$RUNNER_TEMP/$1-dev.log"
            shift
            env "$@" NEXT_PUBLIC_BOOKING_ADMIN_URL=http://admin.booking.localhost:3003 \
              NEXT_PUBLIC_PMS_URL=http://pms.localhost:3004 PORT=3000 \
              npm run dev:marketplace-web > "$dev_log" 2>&1 &
            dev_pid=$!
            for attempt in $(seq 1 120); do
              kill -0 "$dev_pid" 2>/dev/null || break
              if curl --silent --fail --max-time 5 http://127.0.0.1:3000/login >/dev/null; then return 0; fi
              sleep 2
            done
            tail -50 "$dev_log"
            return 1
          }
          stop_dev_server() {
            kill "$dev_pid" 2>/dev/null || true
            # npm runs next as a child: wait until nothing listens on the port (curl exit 7).
            for attempt in $(seq 1 30); do
              status=0
              curl --silent --max-time 2 http://127.0.0.1:3000/login >/dev/null || status=$?
              [ "$status" = 7 ] && return 0
              pkill -f "[n]ext dev" || true
              sleep 1
            done
            echo "The marketplace-web dev server still holds port 3000."
            return 1
          }
          trap 'stop_dev_server || true' EXIT
          start_dev_server marketplace-web
          npm run e2e:marketplace-web -- --workers=1 --retries=1
          stop_dev_server
          start_dev_server marketplace-web-airbnb AIRBNB_IMPORT_CALLBACK_ENABLED=true
          E2E_AIRBNB_IMPORT_CALLBACK=1 npm run e2e:marketplace-web -- --workers=1 --retries=1 \
            tests/e2e/marketplace-web/airbnb-import-start.spec.ts \
            tests/e2e/marketplace-web/airbnb-import-return.spec.ts
        env:
          # Any non-empty CI makes playwright.config.ts use CI reporters; "false" keeps it from
          # starting every app's webServer (that needs CI === "true").
          CI: "false"
          PLAYWRIGHT_HTML_OPEN: never
          E2E_START_SERVERS: "0"
          E2E_MARKETPLACE_BASE_URL: http://127.0.0.1:3000
          # The dev server's test Maps key (playwright.config.ts); in the Playwright process it also
          # makes setup-activation require the Google address search.
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: e2e-google-places

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: marketplace-web-playwright-report
          path: |
            playwright-report
            test-results
            ${{ runner.temp }}/*-dev.log
          retention-days: 7

  # The mocked booking-web Playwright project against a plain-port dev server on the seeded
  # hotel-alpenrose tenant host. The project runs with one worker (playwright.config.ts).
  booking_web_e2e:
    name: Booking Web Browser Specs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.run_booking_web_e2e == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the packages booking-web imports
        run: npm --workspace vayada-api run build:backend-packages

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the booking-web browser specs
        run: |
          npm run dev:booking-web > "$RUNNER_TEMP/booking-web-dev.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            kill -0 "$dev_pid" 2>/dev/null || break
            if curl --silent --fail --max-time 5 http://127.0.0.1:3002/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail --max-time 10 http://127.0.0.1:3002/api/health >/dev/null || { tail -50 "$RUNNER_TEMP/booking-web-dev.log"; exit 1; }
          npm run e2e:booking-web -- --retries=1
        env:
          # See pms_web_e2e: "false" keeps playwright.config.ts from starting every webServer.
          CI: "false"
          PLAYWRIGHT_HTML_OPEN: never
          E2E_START_SERVERS: "0"
          PORT: "3002"
          E2E_BOOKING_BASE_URL: http://hotel-alpenrose.booking.localhost:3002

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: booking-web-playwright-report
          path: |
            playwright-report
            test-results
            ${{ runner.temp }}/*-dev.log
          retention-days: 7

  # Every unit suite under apps/api and the backend packages, with no database. Files that need
  # PostgreSQL skip themselves here; api_postgres runs only the integration files it names (full
  # integration coverage is VAY-2111). Main pushes and a nightly run repeat this job
  # (main-unit-suites.yml) to catch two green PRs that break each other.
  api_unit:
    name: TypeScript API and Package Unit Suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.run_api_unit == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the unit suites
        run: npm run test:unit-suites

  # Each shard gets its own PostgreSQL cluster, so cluster-wide role proofs stay isolated:
  #   platform    - identity, legacy owner, finance worker, Channex worker and authorization proofs
  #   pms         - the PMS/booking/finance integration batch and the migration suites
  #   pricing     - pricing on the ordinary login in its own database (split from pms, VAY-2238)
  #   hotel-setup - hotel setup on the ordinary API login, shared setup profile, logo media and
  #                 nearby places
  # Steps without a `matrix.shard` condition run in every shard.
  api_postgres:
    name: TypeScript API PostgreSQL Integration (PG${{ matrix.postgres }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.run_api_postgres == 'true'
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
        shard: [platform, pms, pricing, hotel-setup]

    services:
      postgres:
        image: ghcr.io/vayada-marketplace/ci-postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: vayada_test
          POSTGRES_PASSWORD: vayada_test
          POSTGRES_DB: vayada_api_test
        options: >-
          --health-cmd "pg_isready -U vayada_test -d vayada_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every `npm run test` in vayada-api has a pretest that rebuilds all backend packages
      # (about 30 s each, two dozen times per job). Build once, then skip pre/post scripts.
      - name: Build backend packages once
        run: |
          npm --workspace vayada-api run build:backend-packages
          echo "npm_config_ignore_scripts=true" >> "$GITHUB_ENV"

      - name: Verify restricted migration source reader
        if: matrix.shard == 'platform'
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2042_source_privilege_test
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.TEST_DATABASE_URL);
            url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href });
            await client.connect();
            await client.query("CREATE DATABASE vay2042_source_privilege_test");
            await client.end();
          '
          npm --workspace @vayada/backend-migration run test -- src/sourceExtractionPrivileges.integration.test.ts

      - name: Verify historical Channex binding evidence and transition guards
        if: matrix.shard == 'platform'
        env:
          VAY2017_BINDING_READER_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_binding_reader_fixture
          VAY2017_BINDING_SOURCE_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_binding_source_fixture
          VAY2017_EVIDENCE_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_evidence_fixture
          VAY2017_TARGET_LOCK_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_target_lock_fixture
          VAY2017_TRANSITION_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_transition_fixture
          VAY2017_BINDING_APPROVAL_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_binding_approval_fixture
          VAY2017_PRODUCTION_PREFLIGHT_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_production_preflight_test
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const root = new URL(process.env.VAY2017_BINDING_READER_TEST_DATABASE_URL);
            root.pathname = "/postgres";
            const client = new pg.Client({ connectionString: root.href });
            await client.connect();
            for (const database of [
              "vay2017_binding_reader_fixture",
              "vay2017_binding_source_fixture",
              "vay2017_evidence_fixture",
              "vay2017_target_lock_fixture",
              "vay2017_transition_fixture",
              "vay2017_binding_approval_fixture",
              "vay2017_production_preflight_test",
            ]) await client.query(`CREATE DATABASE ${database}`);
            await client.end();
          '
          TARGET_DATABASE_URL="$VAY2017_BINDING_READER_TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          TARGET_DATABASE_URL="$VAY2017_BINDING_SOURCE_TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          TARGET_DATABASE_URL="$VAY2017_PRODUCTION_PREFLIGHT_TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          VAY2017_PRODUCTION_PREFLIGHT_TEST_DATABASE_URL="$VAY2017_PRODUCTION_PREFLIGHT_TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run test -- --no-file-parallelism \
            src/cli/legacyHistoricalBindingProductionPreflight.integration.test.ts \
            src/legacyHistoricalBindingTargetReader.test.ts \
            src/legacyHistoricalBindingSourceProof.test.ts \
            src/legacyHistoricalBindingEvidenceSnapshot.test.ts \
            src/legacyHistoricalBindingEnvelope.test.ts \
            src/legacyOwnershipEvidenceReader.integration.test.ts \
            src/legacyHistoricalBindingTargetLocks.integration.test.ts \
            src/legacyHistoricalBindingTransitions.integration.test.ts \
            src/legacyHistoricalBindingApprovals.integration.test.ts

      - name: Verify immutable legacy owner bootstrap receipts
        if: matrix.shard == 'platform'
        env:
          VAY2017_RECEIPT_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_receipt_fixture
          VAY2017_RECEIPT_READER_TEST_DATABASE_URL: postgresql://vay2017_receipt_reader:reader_test_only@127.0.0.1:5432/vay2017_receipt_fixture
        run: |
