name: PR Checks

on:
  pull_request:
    branches:
      - main
      # VAY-2074 stack bases (top of the list to avoid append conflicts).
      - "fm/vay-2074-*"
      - "fm/vay-2075-*"
      - "fm/vay-1092-*"
      - "fm/vay-1362-*"
      - "fix/vay-965-*"
      - "fm/vay-965-*"
      - "fm/vay-1943-*"
      - "fm/vay-2056-*"
      - "fm/vay-1543-*"
      - "fm/vay-2066-*"
      - "fm/vay-2078-*"
      - "fm/vay-2079-*"
      - "fm/vay-2088-*"
      - "fm/vay-2082-*"
      - "fm/vay-2084-*"
      - "fm/vay-2089-*"
      - "fm/vay-2099-*"
      - "fm/vay-2100-*"
      - "fm/vay-2101-*"
      - "fm/vay-2102-*"
      - flamurmaliqi2811/vay-2044-expense-worker-runtime
      - fm/vay-2041-worker-permissions
      - fm/vay-2041-worker-source-permissions
      - fm/vay-2041-worker-preflight

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Job selection is path-based and fails safe: scripts/ci/pr-checks.mjs maps each changed file to
# the jobs that cover it, and any file it cannot classify selects every job. "Required Checks"
# stays the single required status and only accepts a job that succeeded or that was skipped
# because the selector excluded it. Selection lives on the jobs, not on `on.pull_request.paths`,
# so the required status is always reported.
jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_frontend: ${{ steps.select.outputs.run_frontend }}
      run_first_party_auth: ${{ steps.select.outputs.run_first_party_auth }}
      run_api_postgres: ${{ steps.select.outputs.run_api_postgres }}
      run_setup_draft_reset_postgres: ${{ steps.select.outputs.run_setup_draft_reset_postgres }}
      run_backend: ${{ steps.select.outputs.run_backend }}

    steps:
      - name: Checkout merge commit and its parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select jobs from changed paths
        id: select
        run: node scripts/ci/pr-checks.mjs select

  frontend:
    name: Frontend Test, Typecheck, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.run_frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture boundaries
        run: npm run check:architecture-boundaries

      - name: Coordinated release contracts
        run: npm run test:coordinated-release

      - name: PR check selection and aggregation contracts
        run: npm run test:pr-checks

      - name: Finance domain contracts
        run: npm --workspace @vayada/domain-finance run test

      - name: Feature Hub package tests
        run: npm --workspace @vayada/feature-hub run test

      - name: Hotel domain and product onboarding tests
        run: |
          npm --workspace @vayada/domain-hotels run build
          npm --workspace @vayada/domain-hotels run test
          npm --workspace @vayada/product-onboarding run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Booking Admin tests
        run: npm --workspace vayada-booking-engine-frontend-admin run test

      - name: Settings UI package tests
        run: npm --workspace @vayada/settings-ui run test

      - name: Booking Web tests
        run: npm --workspace vayada-booking-engine-frontend run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: "00000000000000000000000000000000"

      # Runs after Build because PMS Web tests import the built @vayada/domain-* packages.
      - name: PMS Web tests
        run: npm --workspace vayada-pms-frontend run test

      - name: Landing consent browser regressions
        run: |
          npx playwright install --with-deps chromium
          npm --workspace vayada-landing run start -- --port 3006 &
          landing_pid=$!
          trap 'kill "$landing_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3006/ >/dev/null; then break; fi
            sleep 1
          done
          npm run e2e:landing -- --workers=2
        env:
          CI: "false"
          E2E_START_SERVERS: "0"
          E2E_LANDING_BASE_URL: http://127.0.0.1:3006
          E2E_LANDING_ANALYTICS: "1"

  first_party_auth:
    name: First-Party Auth Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.run_first_party_auth == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend domain packages
        run: |
          npm --workspace @vayada/domain-hotels run build
          npm --workspace @vayada/domain-booking run build
          npm --workspace @vayada/domain-marketplace run build
          npm --workspace @vayada/domain-pms run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify frontend auth gateways
        run: |
          npm --workspace vayada-creator-marketplace run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-booking-engine-frontend-admin run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-pms-frontend run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-admin run test -- 'app/auth/[...path]/route.test.ts'

      - name: Run first-party auth browser regressions
        run: npm run e2e:first-party-auth
        env:
          E2E_FIRST_PARTY_AUTH_ONLY: "1"
          E2E_START_SERVERS: "1"

  # Each shard gets its own PostgreSQL cluster, so cluster-wide role proofs stay isolated:
  #   platform    - identity, legacy owner, finance worker, Channex worker and authorization proofs
  #   pms         - the PMS/booking/finance integration batch and the migration suites
  #   hotel-setup - hotel setup on the ordinary API login, shared setup profile and logo media
  # Steps without a `matrix.shard` condition run in every shard.
  api_postgres:
    name: TypeScript API PostgreSQL Integration (PG${{ matrix.postgres }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.run_api_postgres == 'true'
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
        shard: [platform, pms, hotel-setup]

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: vayada_test
          POSTGRES_PASSWORD: vayada_test
          POSTGRES_DB: vayada_api_test
        options: >-
          --health-cmd "pg_isready -U vayada_test -d vayada_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every `npm run test` in vayada-api has a pretest that rebuilds all backend packages
      # (about 30 s each, two dozen times per job). Build once, then skip pre/post scripts.
      - name: Build backend packages once
        run: |
          npm --workspace vayada-api run build:backend-packages
          echo "npm_config_ignore_scripts=true" >> "$GITHUB_ENV"

      - name: Verify restricted migration source reader
        if: matrix.shard == 'platform'
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2042_source_privilege_test
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.TEST_DATABASE_URL);
            url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href });
            await client.connect();
            await client.query("CREATE DATABASE vay2042_source_privilege_test");
            await client.end();
          '
          npm --workspace @vayada/backend-migration run test -- src/sourceExtractionPrivileges.integration.test.ts

      - name: Verify historical Channex binding evidence and transition guards
        if: matrix.shard == 'platform'
        env:
          VAY2017_BINDING_READER_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_binding_reader_fixture
          VAY2017_BINDING_SOURCE_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_binding_source_fixture
          VAY2017_EVIDENCE_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_evidence_fixture
          VAY2017_TARGET_LOCK_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_target_lock_fixture
          VAY2017_TRANSITION_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_transition_fixture
          VAY2017_BINDING_APPROVAL_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_binding_approval_fixture
          VAY2017_PRODUCTION_PREFLIGHT_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_production_preflight_test
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const root = new URL(process.env.VAY2017_BINDING_READER_TEST_DATABASE_URL);
            root.pathname = "/postgres";
            const client = new pg.Client({ connectionString: root.href });
            await client.connect();
            for (const database of [
              "vay2017_binding_reader_fixture",
              "vay2017_binding_source_fixture",
              "vay2017_evidence_fixture",
              "vay2017_target_lock_fixture",
              "vay2017_transition_fixture",
              "vay2017_binding_approval_fixture",
              "vay2017_production_preflight_test",
            ]) await client.query(`CREATE DATABASE ${database}`);
            await client.end();
          '
          TARGET_DATABASE_URL="$VAY2017_BINDING_READER_TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          TARGET_DATABASE_URL="$VAY2017_BINDING_SOURCE_TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          TARGET_DATABASE_URL="$VAY2017_PRODUCTION_PREFLIGHT_TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          VAY2017_PRODUCTION_PREFLIGHT_TEST_DATABASE_URL="$VAY2017_PRODUCTION_PREFLIGHT_TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run test -- --no-file-parallelism \
            src/cli/legacyHistoricalBindingProductionPreflight.integration.test.ts \
            src/legacyHistoricalBindingTargetReader.test.ts \
            src/legacyHistoricalBindingSourceProof.test.ts \
            src/legacyHistoricalBindingEvidenceSnapshot.test.ts \
            src/legacyHistoricalBindingEnvelope.test.ts \
            src/legacyOwnershipEvidenceReader.integration.test.ts \
            src/legacyHistoricalBindingTargetLocks.integration.test.ts \
            src/legacyHistoricalBindingTransitions.integration.test.ts \
            src/legacyHistoricalBindingApprovals.integration.test.ts

      - name: Verify immutable legacy owner bootstrap receipts
        if: matrix.shard == 'platform'
        env:
          VAY2017_RECEIPT_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_receipt_fixture
          VAY2017_RECEIPT_READER_TEST_DATABASE_URL: postgresql://vay2017_receipt_reader:reader_test_only@127.0.0.1:5432/vay2017_receipt_fixture
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.VAY2017_RECEIPT_TEST_DATABASE_URL);
            url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href });
            await client.connect();
            await client.query("CREATE DATABASE vay2017_receipt_fixture");
            await client.end();
          '
          npm --workspace @vayada/backend-migration run test -- --no-file-parallelism src/legacyOwnerBootstrapReceipts.integration.test.ts

      - name: Verify scoped legacy owner email guard
        if: matrix.shard == 'platform'
        env:
          VAY2017_EMAIL_GUARD_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_email_guard_fixture
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.VAY2017_EMAIL_GUARD_TEST_DATABASE_URL);
            url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href });
            await client.connect();
            await client.query("CREATE DATABASE vay2017_email_guard_fixture");
            await client.end();
          '
          npm --workspace @vayada/backend-migration run test -- --no-file-parallelism src/legacyOwnerEmailIndexPlan.test.ts

      - name: Verify prepared owner lifecycle guard
        if: matrix.shard == 'platform'
        env:
          VAY2017_LIFECYCLE_TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2017_lifecycle_fixture
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.VAY2017_LIFECYCLE_TEST_DATABASE_URL);
            url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href });
            await client.connect();
            await client.query("CREATE DATABASE vay2017_lifecycle_fixture");
            await client.end();
          '
          TARGET_DATABASE_URL="$VAY2017_LIFECYCLE_TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          npm --workspace vayada-api run test -- --no-file-parallelism src/platform/legacyOwnerLifecycleMutations.integration.test.ts

      - name: Verify Marketplace matching event storage
        if: matrix.shard == 'platform'
        run: npm --workspace @vayada/backend-migration run test -- --no-file-parallelism src/matchingEventProjections.test.ts src/affiliatePercentagePolicyStorage.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify PMS navigation module migration backfill
        if: matrix.shard == 'pms'
        run: npm --workspace @vayada/backend-migration run test -- --no-file-parallelism src/pmsNavigationModules.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Apply target migrations
        run: npm --workspace @vayada/backend-migration run target:migrate -- --env local
        env:
          TARGET_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify creator payout reconciliation detail
        if: matrix.shard == 'platform'
        run: >-
          npm --workspace vayada-api run test -- --no-file-parallelism
          src/financeAffiliatePayoutPortal.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify restricted identity PMS Inbox enqueue
        if: matrix.shard == 'platform'
        run: >-
          npm --workspace @vayada/backend-auth run test -- --no-file-parallelism
          src/staffInvitations.test.ts -t "enqueues an unreadable PMS Inbox job"
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify Finance expense worker permissions and real handlers
        if: matrix.shard == 'platform'
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2044_worker_test
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.TEST_DATABASE_URL); url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href }); await client.connect();
            await client.query("CREATE DATABASE vay2044_worker_test"); await client.end();
          '
          TARGET_DATABASE_URL="$TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          npm --workspace vayada-api run test -- --no-file-parallelism src/jobs/financeExpenseWorkerBoundary.integration.test.ts
          TEST_FINANCE_WORKER_DATABASE_URL=postgresql://vayada_next_finance_expense_worker:fixture@127.0.0.1:5432/vay2044_worker_test npm --workspace vayada-api run test -- --no-file-parallelism src/jobs/financeExpenseGeneration.integration.test.ts

      - name: Verify Financials export worker permissions and real handlers
        if: matrix.shard == 'platform'
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@127.0.0.1:5432/vay2045_worker_test
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.TEST_DATABASE_URL); url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href }); await client.connect();
            await client.query("CREATE DATABASE vay2045_worker_test"); await client.end();
          '
          TARGET_DATABASE_URL="$TEST_DATABASE_URL" npm --workspace @vayada/backend-migration run target:migrate -- --env local
          npm --workspace vayada-api run test -- --no-file-parallelism src/jobs/financeExportWorkerBoundary.integration.test.ts src/jobs/financeFolioExport.integration.test.ts src/jobs/runFinanceDashboardExportOnce.test.ts
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.TEST_DATABASE_URL); url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href }); await client.connect();
            await client.query("DROP DATABASE vay2045_worker_test WITH (FORCE)"); await client.end();
          '

      - name: Verify identity runtime row scope
        if: matrix.shard == 'platform'
        run: bash scripts/test-identity-runtime-row-scope.sh ${{ matrix.postgres }}

      - name: Verify Channex worker shared queue scope
        if: matrix.shard == 'platform'
        run: npm --workspace @vayada/backend-migration run test -- src/channexManagementWorkerQueueScope.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify Channex worker effective privilege boundary
        if: matrix.shard == 'platform'
        run: npm --workspace vayada-api run test -- src/jobs/channexManagementWorkerBoundary.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify Channex worker startup gating
        if: matrix.shard == 'platform'
        run: npm --workspace vayada-api run test -- src/jobs/channexManagementWorkerStartup.test.ts src/channexManagementDatabaseRouting.test.ts

      - name: Verify restricted Channex provider flows
        if: matrix.shard == 'platform'
        run: >-
          npm --workspace vayada-api run test -- --no-file-parallelism
          src/domains/replacementPricingOfferOwners.integration.test.ts
          src/domains/pmsInventoryMaterializationRepository.integration.test.ts
          -t "restricted Channex login"
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify hotel member role repair
        if: matrix.shard == 'platform'
        run: npm --workspace @vayada/backend-migration run test -- --no-file-parallelism src/hotelMemberRoleRepair.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify current authorization and effective property access
        if: matrix.shard == 'platform'
        run: npm --workspace @vayada/backend-authorization run test -- --no-file-parallelism src/index.test.ts -t 'createPgPropertyAccessRepository|createAuthorizationResolver|resolveMembershipRolePermissions'
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Run PMS TypeScript PostgreSQL integration
        if: matrix.shard == 'pms'
        run: >-
          npm --workspace vayada-api run test --
          --no-file-parallelism
          src/marketplaceCollaborations.test.ts
          src/marketplaceAffiliateDestinationRoutes.test.ts
          src/marketplaceAffiliateDiscrepancyRoutes.test.ts
          src/domains/affiliateDiscrepancyRepository.integration.test.ts
          src/domains/bookingAffiliateDestinationSave.integration.test.ts
          src/domains/bookingAffiliateReferralTransportCertificationStorage.integration.test.ts
          src/domains/bookingAffiliateReferralTransportCertification.integration.test.ts
          src/domains/bookingAffiliateReferralProductionPreflightStorage.integration.test.ts
          src/domains/bookingAffiliateReferralProductionPreflight.integration.test.ts
          src/domains/bookingAffiliateReferralReadiness.integration.test.ts
          src/domains/bookingAffiliateDestinationTrackingReadiness.integration.test.ts
          src/domains/bookingAffiliateNativeDestinationSafety.integration.test.ts
          src/domains/bookingAffiliateSourceCapabilityEvidenceStorage.integration.test.ts
          src/domains/bookingAffiliateSourceCapabilityCertification.integration.test.ts
          src/domains/bookingAffiliateSourceCapabilityProductionPreflight.integration.test.ts
          src/domains/marketplaceAffiliateDraftCommand.integration.test.ts
          src/domains/marketplaceAffiliatePublicationPrerequisites.test.ts
          src/domains/marketplaceAffiliatePublication.integration.test.ts
          src/domains/marketplaceAffiliatePublicationStorage.integration.test.ts
          src/domains/marketplaceAffiliateAssentStorage.integration.test.ts
          src/domains/marketplaceAffiliateAgreementActivationStorage.integration.test.ts
          src/domains/marketplaceAffiliateLinkStorage.integration.test.ts
          src/domains/marketplaceAffiliateLinkCreation.integration.test.ts
          src/domains/marketplaceAffiliateAgreementActivation.integration.test.ts
          src/domains/marketplaceAffiliateAgreementLifecycleCommand.integration.test.ts
          src/domains/marketplaceAffiliateAssentCommand.integration.test.ts
          src/domains/marketplaceAffiliateAssentRead.integration.test.ts
          src/domains/marketplaceAffiliateCollaborationRead.integration.test.ts
          src/domains/pmsAffiliateCompletionEvidence.integration.test.ts
          src/domains/financeAffiliatePercentagePolicySave.integration.test.ts
          src/domains/financeAffiliateEarningJournalStorage.integration.test.ts
          src/domains/financeAffiliateEarningJournal.integration.test.ts
          src/domains/financeAffiliatePercentagePolicyResolver.test.ts
          src/marketplaceAffiliatePolicyRoutes.test.ts
          src/domains/pmsLinkedInventoryGroupRepository.integration.test.ts
          src/domains/pmsRoomFactsCommandRepository.integration.test.ts
          src/domains/pmsRoomOperatingEligibility.integration.test.ts
          src/domains/pmsCalendarClosure.integration.test.ts
          src/domains/pmsPhysicalRoomUnitReconcileRepository.integration.test.ts
          src/domains/pmsPhysicalRoomManagementRepository.integration.test.ts
          src/domains/pmsRoomPublicationCommandRepository.integration.test.ts
          src/domains/pmsCalendarAutoOpenSettingsRepository.integration.test.ts
          src/pmsNavigationModules.integration.test.ts
          src/pmsNavigationModules.test.ts
          src/jobs/pmsChannexScheduler.integration.test.ts
